name: tag-release

# Tags every PR merged into main with the next version and publishes a GitHub Release.
# The bump is chosen with labels on the PR:
#   major         → v1.2.3 → v2.0.0
#   minor         → v1.2.3 → v1.3.0
#   (none)        → v1.2.3 → v1.2.4
#   skip-release  → no tag (docs, CI, chores)
# With no previous tag the first release is v0.1.0 (or v1.0.0 with "major").

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'skip-release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # Only plain vX.Y.Z tags count: pre-releases such as v1.0.0-rc1 are ignored.
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          case ",$LABELS," in
            *,major,*) bump=major ;;
            *,minor,*) bump=minor ;;
            *)         bump=patch ;;
          esac
          if [ -z "$latest" ]; then
            [ "$bump" = major ] && next=v1.0.0 || next=v0.1.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "$bump" in
              major) next="v$((major + 1)).0.0" ;;
              minor) next="v${major}.$((minor + 1)).0" ;;
              patch) next="v${major}.${minor}.$((patch + 1))" ;;
            esac
          fi
          echo "latest=${latest:-none} bump=$bump next=$next"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Create tag
        env:
          NEXT: ${{ steps.version.outputs.next }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "$NEXT" -m "#$PR_NUMBER $PR_TITLE"
          git push origin "$NEXT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: gh release create "$NEXT" --verify-tag --generate-notes --title "$NEXT"
